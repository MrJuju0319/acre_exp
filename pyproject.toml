[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = true
disable_error_code = ["import-untyped", "attr-defined", "no-any-return", "arg-type", "operator", "var-annotated", "union-attr"]
